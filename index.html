<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoToBuy</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="titulo"></div>

<!-- ================= MENU ================= -->
<div id="menu">
  <h2>GoToBuy</h2>

  <button onclick="startGame('manual')">Modo Manual</button>
  <button onclick="startGame('auto')">Modo Automático</button>
  <button onclick="mostrarPartidas()">Partidas guardadas</button>
</div>

<!-- ================= JUEGO ================= -->
<div id="game" class="hidden">

  <div id="hud"></div>
  <div id="screen"></div>

  <div id="shop" class="hidden">
    <div id="productos"></div>
    <input id="input" placeholder="Ej: 1 3 5">
    <button onclick="comprar()">Comprar</button>
  </div>

  <!-- 🔙 BOTÓN VOLVER MENU -->
  <button onclick="volverMenu()">Volver al menú</button>

</div>

<!-- ================= PARTIDAS ================= -->
<div id="partidas" class="hidden">
  <h2>Partidas guardadas</h2>
  <div id="listaPartidas"></div>
  <button onclick="volverMenu()">Volver</button>
</div>

<!-- ================= FINAL ================= -->
<div id="end" class="hidden">
  <h2>Fin de partida</h2>
  <div id="resultado"></div>
  <button onclick="volverMenu()">Volver al menú</button>
</div>

<script src="game.js"></script>

</body>
</html>
