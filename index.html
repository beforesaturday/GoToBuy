<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GoToBuy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🛒 GoToBuy</h1>

<div class="container" id="menu">
    <button class="btn green" onclick="startGame('auto')">Automático</button>
    <button class="btn blue" onclick="startGame('manual')">Manual</button>
    <button class="btn purple" onclick="showHistory()">Historial</button>
</div>

<div id="game" class="hidden">
    <h2 id="saldo"></h2>

    <div id="map"></div>
    <p>Usa ← → para moverte</p>

    <div id="shop" style="display:none;"></div>

    <input type="text" id="input" placeholder="Ej: 1 2 3">
    <br>
    <button class="btn green" onclick="submitBuy()">Comprar</button>

    <p id="hint"></p>
</div>

<div id="result" class="hidden">
    <h2 id="resultado"></h2>
    <button class="btn blue" onclick="reset()">Volver</button>
</div>

<!-- 🔥 IMPORTANTE -->
<script src="script.js" defer></script>

</body>
</html>
