<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoToBuy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<pre id="title"></pre>

<div id="menu">
  <button onclick="startGame('auto')">1. Jugar automático</button>
  <button onclick="startGame('manual')">2. Jugar manual</button>
  <button onclick="showPartidas()">3. Partidas anteriores</button>
</div>

<div id="game" class="hidden">
  <pre id="screen"></pre>
  <div id="hud"></div>
</div>

<div id="shop" class="hidden">
  <h2 class="purple">🏪 TIENDA</h2>
  <div id="productos"></div>
  <input id="input" placeholder="Ej: 1 3 5">
  <button onclick="comprar()">Comprar</button>
</div>

<div id="end" class="hidden">
  <h2 class="fuchsia">🏁 FIN DE PARTIDA</h2>
  <div id="resultado"></div>
  <button onclick="location.reload()">Volver al menú</button>
</div>

<div id="historial" class="hidden"></div>

<script src="game.js"></script>
</body>
</html>
