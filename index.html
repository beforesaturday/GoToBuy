<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoToBuy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="title"></div>

  <div id="game">
    <pre id="screen"></pre>
  </div>

  <div id="hud">
    <p id="saldo"></p>
    <p id="info"></p>
  </div>

  <div id="shop" class="hidden">
    <h2>🏪 TIENDA</h2>
    <div id="products"></div>

    <input id="input" placeholder="Ej: 1 3 5">
    <button onclick="confirmBuy()">Comprar</button>
  </div>

  <div id="end" class="hidden">
    <h2>🏁 FIN</h2>
    <p id="result"></p>
    <button onclick="restart()">Reiniciar</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
