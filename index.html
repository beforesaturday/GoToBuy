<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>GoToBuy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1 id="title">🛒 GoToBuy</h1>

<div id="menu">
  <button onclick="startGame('auto')">Jugar automático</button>
  <button onclick="startGame('manual')">Jugar manual</button>
  <button onclick="showHistory()">Partidas anteriores</button>
  <button onclick="resetGame()">Salir</button>
</div>

<div id="shop" class="hidden">
  <h2>🏪 TIENDA</h2>

  <p id="saldo"></p>
  <div id="productos"></div>

  <input id="input" placeholder="Ej: 1 3 5" />
  <button onclick="buy()">Comprar</button>
</div>

<script src="script.js"></script>
</body>
</html>
