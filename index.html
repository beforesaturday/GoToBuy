<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoToBuy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<pre id="title"></pre>

<div id="menu">
  <button onclick="start('auto')">1. Jugar automático</button>
  <button onclick="start('manual')">2. Jugar manual</button>
  <button onclick="showHistory()">3. Partidas anteriores</button>
  <button onclick="alert('Salir')">4. Salir</button>
</div>

<div id="game" class="hidden">
  <pre id="screen"></pre>
  <p id="hud"></p>
</div>

<div id="shop" class="hidden">
  <h2>🏪 TIENDA</h2>
  <div id="products"></div>
  <input id="input" placeholder="Ej: 1 3 5">
  <button onclick="buy()">Comprar</button>
</div>

<div id="history" class="hidden"></div>

<div id="result" class="hidden"></div>

<script src="game.js"></script>
</body>
</html>
