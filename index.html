<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoToBuy</title>
  <style>
    .hidden { display: none; }
    body { background:#111; color:white; font-family: monospace; }
    button { margin:5px; padding:10px; }
  </style>
</head>

<body>

<!-- 🔥 TITULO ASCII -->
<div id="titulo"></div>

<!-- 🔥 MENU -->
<div id="menu">
  <h2>GoToBuy</h2>

  <button onclick="startGame('manual')">Modo Manual</button>
  <button onclick="startGame('auto')">Modo Automático</button>
</div>

<!-- 🔥 JUEGO -->
<div id="game" class="hidden">

  <div id="hud"></div>
  <div id="screen"></div>

  <!-- TIENDA -->
  <div id="shop" class="hidden">
    <div id="productos"></div>

    <input id="input" placeholder="Ej: 1 3 5">
    <button onclick="comprar()">Comprar</button>
  </div>

</div>

<!-- 🔥 FINAL -->
<div id="end" class="hidden">
  <h2>Resultado</h2>
  <div id="resultado"></div>
</div>

<!-- 🔥 TU JS -->
<script src="game.js"></script>

</body>
</html>
