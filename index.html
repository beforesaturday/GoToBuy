<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Juego Tienda</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<pre id="game"></pre>

<div id="menu">
  <h1>🛒 JUEGO TIENDA</h1>
  <button onclick="startGame('auto')">Jugar automático</button>
  <button onclick="startGame('manual')">Jugar manual</button>
  <button onclick="showHistory()">Partidas anteriores</button>
  <button onclick="clearScreen()">Salir</button>
</div>

<div id="shop" class="hidden">
  <h2>🏪 TIENDA</h2>
  <p id="saldo"></p>
  <div id="productos"></div>
  <input id="input" placeholder="Ej: 1 3 5" />
  <button onclick="buy()">Comprar</button>
</div>

<script src="script.js"></script>
</body>
</html>
